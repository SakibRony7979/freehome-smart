name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # এখানে আমরা সংস্করণ পরিবর্তন করে ৮.৭ করে দিয়েছি যা আপনার অ্যাপের জন্য পারফেক্ট
      - name: Regenerate Gradle Wrapper Files
        run: gradle wrapper --gradle-version 8.7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeHome-App-Debug
          path: "**/build/outputs/apk/debug/*-debug.apk"
