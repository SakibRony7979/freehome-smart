name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: .
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          elif [ -f "freehome-smart/gradlew" ]; then
            cd freehome-smart && chmod +x gradlew
          else
            find . -name "gradlew" -exec chmod +x {} \;
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -z "$GRADLEW_PATH" ]; then
              echo "Error: gradlew file not found anywhere in the repository!"
              exit 1
            fi
            DIR_PATH=$(dirname "$GRADLEW_PATH")
            cd "$DIR_PATH" && ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeHome-App-Debug
          path: "**/build/outputs/apk/debug/*-debug.apk"
